services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fnbaqua
      POSTGRES_USER: fnbaqua
      POSTGRES_PASSWORD: fnbaqua
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - media_data:/app/media
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    volumes:
      - media_data:/media:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  media_data:
  caddy_data:
  caddy_config:
