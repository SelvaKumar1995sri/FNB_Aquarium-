server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Django serves this itself via whitenoise, regardless of DEBUG.
    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    # Django only serves /media/ when DEBUG=True, so in staging nginx reads
    # it directly off the volume shared with the backend container instead.
    location /media/ {
        alias /media/;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router SPA — unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
